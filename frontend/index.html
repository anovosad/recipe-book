<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbf8f7" />

    <!-- Primary Meta Tags -->
    <title>Recipe Book - Save &amp; Share Your Favorite Recipes</title>
    <meta name="description" content="Create, organize, and share your favorite recipes with Recipe Book. Add ingredients, cooking instructions, photos, and tags to build your personal cookbook." />
    <meta name="keywords" content="recipes, cooking, food, cookbook, ingredients, meal planning" />
    <meta name="author" content="Recipe Book" />

    <!-- Fonts. Tailwind is compiled into the bundle now, so this is the only
         thing still fetched from a third party. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"></noscript>

    <style>
        /* Above-the-fold only: the page ground and the splash. Everything else
           comes from the compiled stylesheet. */
        body {
            margin: 0;
            font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
            background-color: #fbf8f7;
        }

        #loading-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            z-index: 9999;
            background-image:
                radial-gradient(58rem 32rem at 8% -12%, rgba(255, 142, 83, 0.13), transparent 62%),
                radial-gradient(46rem 30rem at 102% 4%, rgba(120, 180, 255, 0.13), transparent 58%),
                linear-gradient(155deg, #fdfaf9 0%, #f7f2f5 52%, #f1f1f8 100%);
            transition: opacity 0.25s ease-out, visibility 0.25s;
        }

        #loading-screen[hidden] {
            display: flex;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loading-spinner {
            width: 2.5rem;
            height: 2.5rem;
            border: 3px solid rgba(255, 107, 107, 0.25);
            border-top-color: #ff6b6b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading-label {
            color: #ff6b6b;
            font-weight: 500;
            letter-spacing: 0.01em;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (prefers-reduced-motion: reduce) {
            .loading-spinner { animation-duration: 2s; }
            #loading-screen { transition: none; }
        }

        #root { opacity: 0; transition: opacity 0.2s ease-in; }
        #root.loaded { opacity: 1; }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="loading-spinner"></div>
        <div class="loading-label">Loading…</div>
    </div>

    <!-- Outside #root on purpose: React clears its container on the first
         render, so anything parked in there is thrown away before it is read. -->
    <noscript>
        <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
            <div style="background: white; padding: 2rem; border-radius: 1rem; text-align: center; max-width: 25rem; box-shadow: 0 8px 24px rgba(31, 38, 135, 0.12);">
                <h1 style="color: #ff6b6b; margin: 0 0 1rem;">JavaScript Required</h1>
                <p style="color: #6b7280; margin: 0;">
                    Recipe Book requires JavaScript to run. Please enable JavaScript in your browser to continue.
                </p>
            </div>
        </div>
    </noscript>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>

    <script>
        // main.tsx hides the splash as soon as React has painted. This is only
        // the safety net for a bundle that never arrives - the previous version
        // watched #root for a second child, which React's container clearing
        // means never happens, so the fixed timeout was doing all the work and
        // every visit sat on the spinner for its full duration.
        setTimeout(function () {
            var screen = document.getElementById('loading-screen');
            if (screen && !screen.hasAttribute('hidden')) screen.setAttribute('hidden', '');
        }, 8000);
    </script>
</body>
</html>
