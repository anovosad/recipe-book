# The HTTPS server. Copied into /etc/nginx/tls/ by tls-bootstrap.sh only once a
# Let's Encrypt certificate exists, which is why it can reference the files
# unconditionally - and why HSTS is safe to send from here.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    # Symlinks maintained by tls-bootstrap.sh, so nothing here names a domain.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/conf.d/security-headers.inc;
    # A year, and deliberately without includeSubDomains or preload: other
    # things may live on sibling names, and preload is close to irreversible.
    add_header Strict-Transport-Security "max-age=31536000" always;

    limit_conn conn_limit_per_ip 20;

    include /etc/nginx/conf.d/app.inc;
}
