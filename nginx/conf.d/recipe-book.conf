# Main recipe book configuration
#
# Port 80 always exists, because Let's Encrypt proves control of this host by
# fetching a file over plain HTTP and that has to work before any certificate
# does. What port 80 does with everything *else* - serve the app, or redirect to
# HTTPS - is decided at container start by nginx/tls-bootstrap.sh, which also
# activates the HTTPS server. Neither happens until a certificate actually
# exists, so nginx can never fail to start over a file that is not there.
upstream recipe_app {
    server recipe-app:8080;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;

    include /etc/nginx/conf.d/security-headers.inc;
    limit_conn conn_limit_per_ip 20;

    # The ACME challenge stays on plain HTTP and is never redirected. ^~ so it
    # wins over the regex locations in app.inc.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    # Written by tls-bootstrap.sh: either the app, or a redirect to HTTPS.
    include /etc/nginx/tls/http-mode.inc;
}
