# Main recipe book configuration
upstream recipe_app {
    server recipe-app:8080;
    keepalive 32;
}

# Port 80 is the only port the compose file publishes: both the 443 mapping and
# the ssl_certificates volume are commented out there, and nginx/ssl is empty.
# The TLS server block that used to hold all of this is kept at the bottom of
# the file, commented out - it referenced /etc/nginx/ssl/cert.pem, which does not
# exist, so nginx refused to start and crash-looped, which is why nothing was
# reachable after the stack was recreated.
server {
    listen 80 default_server;
    server_name _;

    # Security headers. Strict-Transport-Security deliberately stays with the
    # TLS block: browsers ignore it over plain HTTP, and promising HTTPS from a
    # deployment that does not serve it locks users out.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Connection and request limits
    limit_conn conn_limit_per_ip 20;

    # Block common attack patterns
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # API endpoints with rate limiting
    location /api/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://recipe_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/register {
        limit_req zone=register burst=2 nodelay;
        proxy_pass http://recipe_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/search {
        limit_req zone=search burst=10 nodelay;
        proxy_pass http://recipe_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://recipe_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        limit_req zone=static burst=50 nodelay;
        expires 1y;
        add_header Cache-Control "public, immutable";
        proxy_pass http://recipe_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main application
    location / {
        limit_req zone=general burst=50 nodelay;
        proxy_pass http://recipe_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

# TLS. To turn this back on you need all three of:
#   1. certificates in nginx/ssl (cert.pem + key.pem),
#   2. the ssl_certificates volume uncommented in docker-compose-portainer.yml
#      so they reach /etc/nginx/ssl,
#   3. the "${HTTPS_PORT:-443}:443" port mapping uncommented.
# Leaving this block active without them is what crash-looped nginx. Note also
# that `listen ... http2` is deprecated in current nginx; use a separate
# `http2 on;` directive.
#
# server {
#     listen 443 ssl;
#     http2 on;
#     server_name _;
#
#     ssl_certificate /etc/nginx/ssl/cert.pem;
#     ssl_certificate_key /etc/nginx/ssl/key.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384;
#     ssl_prefer_server_ciphers off;
#     ssl_session_cache shared:SSL:10m;
#     ssl_session_timeout 10m;
#
#     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#
#     # ... same location blocks as the port 80 server above
# }
